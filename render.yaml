services:
  - type: web
    name: loans-back
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && npx prisma generate && pnpm build
    startCommand: node dist/main
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: APP_NAME
        value: loans-back

      # JWT — set strong random values in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_SIGNATURE_SECRET
        sync: false
      - key: JWT_SIGNATURE_EXPIRES_IN
        value: 5m

      # Database — use internal Render URL (same network, no SSL needed)
      - key: DATABASE_URL
        value: postgresql://investments_db_5uie_user:w8s2amboGkauEL5N87lSLHHquq2Nr8hS@dpg-d877js9s16ns738qnhkg-a/investments_db_5uie?schema=public

      # Redis — internal Render URL
      - key: REDIS_URL
        value: redis://red-d877m5km0tmc739kiqe0:6379

      # CORS — set this to your deployed frontend URL
      - key: FRONTEND_URL
        sync: false

      - key: RESET_TOKEN_TTL
        value: 900
